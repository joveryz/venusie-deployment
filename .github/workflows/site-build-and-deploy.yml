name: "site-build-and-deploy"
on:
  push:
    branches:
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  repository_dispatch:
    types: [dispatch-event]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Checkout Framework
        uses: actions/checkout@v7
        with:
          repository: joveryz/jekyll-theme-chirpy
          ref: dev
          path: ./site_framework
          fetch-depth: 0

      - name: Checkout Site Data redebug-data
        uses: actions/checkout@v7
        with:
          repository: joveryz/redebug-data
          ref: master
          token: ${{ secrets.PAT }}
          path: ./site_data_redebug
          fetch-depth: 0

      - name: Checkout Site Data venusie-data
        uses: actions/checkout@v7
        with:
          repository: joveryz/venusie-data
          ref: master
          token: ${{ secrets.PAT }}
          path: ./site_data_venusie
          fetch-depth: 0

      - name: Generate dynamic content
        shell: pwsh
        run: |
          Get-ChildItem ./site_data_redebug/tools -Filter *.ps1 | Sort-Object Name | ForEach-Object {
            Write-Host "Running $($_.Name)"
            & $_.FullName
          }

      - name: Merge Framework and Data
        run: |
          rm -rf .git
          cp -R ./site_framework/* ./
          mkdir -p ./site_data_redebug_shared
          while IFS= read -r p; do
            p="${p%$'\r'}"
            case "$p" in ''|\#*) continue ;; esac
            if [ ! -e "site_data_redebug/$p" ]; then
              echo "::error::shared path not found: $p"; exit 1
            fi
            echo "sharing: $p"
            rsync -Rav "site_data_redebug/./$p" ./site_data_redebug_shared/
            # a _posts/*.md entry also pulls its image folder if present
            case "$p" in
              _posts/*.md)
                img="assets/img/posts/$(basename "$p" .md)"
                [ -d "site_data_redebug/$img" ] && rsync -Rav "site_data_redebug/./$img" ./site_data_redebug_shared/
                ;;
            esac
          done < site_data_redebug/_shared
          cp -R ./site_data_redebug_shared/. ./
          # use cp /. to copy .git folders, jekyll need this to find last modified date of posts
          cp -R ./site_data_venusie/. ./
          rm -rf ./site_framework
          rm -rf ./site_data_redebug
          rm -rf ./site_data_redebug_shared
          rm -rf ./site_data_venusie
          find .

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build Site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test Site
        run: |
          bundle exec htmlproofer "_site${{ steps.pages.outputs.base_path }}" \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
      - name: Send Notification
        run: |
          status_icon() {
            case "$1" in
              success) echo "✅";;
              failure) echo "❌";;
              skipped) echo "⏭️";;
              cancelled) echo "🚫";;
              *) echo "$1";;
            esac
          }
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            curl -s "https://api.day.app/${{ secrets.BARK_TOKEN }}/Github-Venusie/%23${{ github.run_id }}%20%E2%9C%85"
          else
            BUILD=$(status_icon "${{ needs.build.result }}")
            DEPLOY=$(status_icon "${{ needs.deploy.result }}")
            BODY=$(echo "#${{ github.run_id }} ❌ (Build:${BUILD} Deploy:${DEPLOY})" | jq -sRr @uri)
            curl -s "https://api.day.app/${{ secrets.BARK_TOKEN }}/Github-Venusie/${BODY}"
          fi
